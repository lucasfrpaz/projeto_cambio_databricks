resources:
  jobs:
    job_cambio:
      name: job_cambio

      description: >
        Pipeline de ingestão e processamento das cotações PTAX,
        utilizando arquitetura Landing, Bronze, Silver e Gold.

      tasks:
        - task_key: landing

          notebook_task:
            notebook_path: ../src/job_cambio/01_landing.ipynb
            source: WORKSPACE

          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          timeout_seconds: 300

        - task_key: bronze

          depends_on:
            - task_key: landing

          notebook_task:
            notebook_path: ../src/job_cambio/02_bronze.ipynb
            source: WORKSPACE

            base_parameters:
              run_id: "{{job.run_id}}"
              job_id: "{{job.id}}"
              job_name: "{{job.name}}"
              task_name: "{{task.name}}"

          run_if: ALL_SUCCESS

          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          timeout_seconds: 300

        - task_key: silver

          depends_on:
            - task_key: bronze

          notebook_task:
            notebook_path: ../src/job_cambio/03_silver.ipynb
            source: WORKSPACE

          run_if: ALL_SUCCESS

          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          timeout_seconds: 300

        - task_key: quality_checks

          depends_on:
            - task_key: silver

          notebook_task:
            notebook_path: ../src/job_cambio/04_quality_checks.ipynb
            source: WORKSPACE

          run_if: ALL_SUCCESS

          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          timeout_seconds: 300

        - task_key: gold_cotacao_diaria

          depends_on:
            - task_key: quality_checks

          notebook_task:
            notebook_path: ../src/job_cambio/05_gold_cotacao_diaria.ipynb
            source: WORKSPACE

          run_if: ALL_SUCCESS

          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          timeout_seconds: 300

        - task_key: gold_indicadores

          depends_on:
            - task_key: gold_cotacao_diaria

          notebook_task:
            notebook_path: ../src/job_cambio/06_gold_indicadores.ipynb
            source: WORKSPACE

          run_if: ALL_SUCCESS

          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          timeout_seconds: 300

      email_notifications:
        on_failure:
          - lucas.paaz5@gmail.com

        on_duration_warning_threshold_exceeded:
          - lucas.paaz5@gmail.com

      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true
        alert_on_last_attempt: true

      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 300

      max_concurrent_runs: 1

      queue:
        enabled: true

      performance_target: PERFORMANCE_OPTIMIZED

      schedule:
        quartz_cron_expression: "0 0 14,17 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED

      timeout_seconds: 1800